<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ujjval Chavda · Projects</title>
  <meta name="description" content="Projects by Ujjval Chavda: websites, Mac apps, and 3D work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --accent: #c2410c;
      --chip: #f5f5f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #292524;
        --accent: #fb923c;
        --chip: #292524;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
    }
    main { max-width: 880px; margin: 0 auto; padding: 64px 20px 48px; }
    header h1 { font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
    header p { color: var(--muted); margin: 0; max-width: 560px; }
    header .links { margin-top: 20px; display: flex; gap: 16px; flex-wrap: wrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 56px 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card h3 { margin: 0; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; flex: 1; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tags span { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; color: var(--muted); }
    .card .actions { display: flex; gap: 14px; font-size: 0.9rem; font-weight: 500; }
    .status { font-size: 0.78rem; color: var(--muted); }
    footer { margin-top: 64px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ujjval Chavda</h1>
      <p>I build websites, small Mac apps, and 3D and CAD tools. Here are some of my projects.</p>
      <div class="links">
        <a href="https://github.com/ChavdaUjjval">GitHub</a>
      </div>
    </header>

    <h2>Projects</h2>
    <div class="grid" id="projects"></div>

    <footer>Hosted free on GitHub Pages.</footer>
  </main>

  <script>
    // Add a project: copy one entry. "live" and "code" are optional links.
    const projects = [
      {
        name: "The Spice Desi",
        about: "Website for a spice export business: product range, export process, and a contact form.",
        tags: ["HTML", "CSS", "JavaScript", "PHP"],
        live: "https://thespicedesi.com"
      },
      {
        name: "Copycat",
        about: "A macOS clipboard-history app that lives in the Dock. Written in Swift as a single file.",
        tags: ["Swift", "macOS"]
      },
      {
        name: "Benchy at Sea",
        about: "A scripted Blender scene of the 3DBenchy boat on an ocean at golden hour, with three cameras and a chase shot.",
        tags: ["Blender", "Python", "3D"]
      },
      {
        name: "3D Anatomy Study Portal",
        about: "Interactive 3D bone models for first-year MBBS students. Every fact is checked against the textbook page.",
        tags: ["three.js", "Education"],
        status: "In progress"
      }
    ];

    const grid = document.getElementById("projects");
    for (const p of projects) {
      const card = document.createElement("article");
      card.className = "card";
      const links = [
        p.live && `<a href="${p.live}">Visit site →</a>`,
        p.code && `<a href="${p.code}">Code</a>`
      ].filter(Boolean).join("");
      card.innerHTML = `
        <h3>${p.name}</h3>
        ${p.status ? `<div class="status">${p.status}</div>` : ""}
        <p>${p.about}</p>
        <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>
        ${links ? `<div class="actions">${links}</div>` : ""}`;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
